name: "Google Chat Notification"
description: "Send deployment notifications to Google Chat"
branding:
  icon: "message-square"
  color: "blue"

inputs:
  webhook_url:
    description: "Google Chat webhook URL"
    required: true
  status:
    description: "Status of the workflow - use 'job.status'"
    required: true

runs:
  using: "composite"
  steps:
    - name: Send notification
      shell: bash
      # Pass every expression through env, never inline in the script:
      # commit messages can contain backticks and $(...) that bash would run.
      env:
        WEBHOOK_URL: ${{ inputs.webhook_url }}
        JOB_STATUS: ${{ inputs.status }}
        REPOSITORY: ${{ github.repository }}
        WORKFLOW: ${{ github.workflow }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ACTOR: ${{ github.actor }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        if [ "$JOB_STATUS" = "success" ]; then
          ICON="✅"
          STATUS="successful"
        elif [ "$JOB_STATUS" = "failure" ]; then
          ICON="❌"
          STATUS="failed"
        else
          ICON="🟨"
          STATUS="canceled"
        fi

        MESSAGE="${ICON} ${REPOSITORY} ${WORKFLOW} deployment ${STATUS}!

        ${RUN_URL}
        Trigger: ${ACTOR}
        Commit: ${COMMIT_MESSAGE}"

        jq -n --arg text "$MESSAGE" '{text: $text}' \
        | curl -sS -X POST -H 'Content-Type: application/json' \
          --data-binary @- "$WEBHOOK_URL"
